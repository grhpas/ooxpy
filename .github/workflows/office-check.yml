name: Office check

# Manual run of the Office compatibility corpus on self-hosted Windows machines
# with Microsoft Office.  Register a runner on each machine with the labels
# below (e.g. "office2007", "office2016"); see tools/officecheck/README.md.

on:
  workflow_dispatch:
    inputs:
      office:
        description: "Runner label of the Office machine (e.g. office2016)"
        required: true
        default: office2016
      only:
        description: "Only cases whose id contains this text (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . python-docx python-pptx
      - run: python -m tools.officecheck.generate corpus
      - uses: actions/upload-artifact@v4
        with:
          name: officecheck-corpus
          path: corpus

  office:
    needs: corpus
    runs-on: [self-hosted, windows, "${{ inputs.office }}"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: officecheck-corpus
          path: corpus
      - name: Run the corpus through Office
        shell: cmd
        run: py corpus\check_office.py corpus --only "${{ inputs.only }}"
        continue-on-error: true   # failures are the report's job; always upload results
      - name: Report
        shell: cmd
        run: py corpus\report.py corpus
      - uses: actions/upload-artifact@v4
        with:
          name: officecheck-results-${{ inputs.office }}
          path: |
            corpus/results-*.json
            corpus/REPORT.md
