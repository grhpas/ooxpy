name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]" openpyxl python-pptx pillow
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tools tests examples
      - run: pyright

  docs:
    # Every code block in the guides runs (tests/test_docs.py); the API reference
    # matches the docstrings; the site builds with --strict.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest tests/test_docs.py tests/test_public_api.py -q
      - run: mkdocs build --strict

  generated-code:
    # The committed generated code must equal a fresh generation from the
    # pinned Open XML SDK revision (tools/gen/SDK_REVISION).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m tools.gen.fetch_sdk "$RUNNER_TEMP/sdk"
      - run: OOX_SDK_DATA="$RUNNER_TEMP/sdk/data" python -m pytest tests/test_generator.py -q

  libreoffice:
    # Runs the Office-check corpus through LibreOffice (probes on what it reads back).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
      - run: python -m pip install -e ".[dev]" python-pptx
      - run: OOX_LIBREOFFICE=1 python -m pytest tests/test_officecheck.py -q
