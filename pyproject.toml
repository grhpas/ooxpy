[build-system]
requires = ["setuptools>=77"]  # 77: PEP 639 license expressions and license-files
build-backend = "setuptools.build_meta"

[project]
name = "ooxpy"  # import name: oox
dynamic = ["version"]
description = "Office Open XML (docx, xlsx, pptx) the odfpy way: a factory per element, generated from the schemas, with validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["lxml>=5.0"]
keywords = ["docx", "xlsx", "pptx", "ooxml", "office open xml", "word", "excel", "powerpoint", "odfpy", "ecma-376"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/grhpas/ooxpy"
Documentation = "https://grhpas.github.io/ooxpy/"
Source = "https://github.com/grhpas/ooxpy"
Issues = "https://github.com/grhpas/ooxpy/issues"
# repository is public (see RELEASING.md).

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1", "XlsxWriter>=3.2", "ruff", "pyright", "pyyaml"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pymdown-extensions>=10"]  # MkDocs 2 drops plugins and themes

[project.scripts]
oox = "oox.__main__:console_main"

[tool.setuptools.dynamic]
version = { attr = "oox.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oox = ["py.typed", "ns/*.pyi"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/oox/document.py"]
addopts = "--doctest-modules -q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/oox/_generated", "src/oox/ns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "S110", "PLW1510"]
ignore = [
  "UP031",   # %-formatting is kept on purpose in the Python-3.8 Windows-side scripts
  "RUF001", "RUF002", "RUF003",  # Greek test text and typographic characters are intentional
  "E731",    # small lambdas as local helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110", "B017", "E501"]
"tools/officecheck/check_office.py" = ["UP", "S110"]  # runs on Python 3.8; best-effort cleanup paths
"tools/officecheck/report.py" = ["UP"]

[tool.pyright]
include = ["src/oox"]
exclude = ["src/oox/_generated", "src/oox/ns"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingModuleSource = false
