site_name: ooxpy
site_description: Office Open XML (docx, xlsx, pptx) for Python, the odfpy way
repo_url: https://github.com/grhpas/ooxpy
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Word: guide/word.md
      - Excel: guide/excel.md
      - PowerPoint: guide/powerpoint.md
      - Charts: guide/charts.md
      - Existing files: guide/existing-files.md
      - Reading as Word shows it: guide/reading.md
      - Validation and Office versions: guide/validation.md
  - Cookbook: cookbook.md
  - Command line: cli.md
  - Coming from odfpy: odfpy.md
  - Office compatibility: office.md
  - Limitations and FAQ: faq.md
  - API reference:
      - reference/index.md
      - Documents (common): reference/documents.md
      - Word: reference/word.md
      - Excel: reference/excel.md
      - PowerPoint: reference/powerpoint.md
      - Charts: reference/charts.md
      - Elements: reference/elements.md
      - Package and properties: reference/package.md
      - Records: reference/records.md
      - Units and errors: reference/utilities.md
  - Project:
      - API stability: STABILITY.md
      - API decisions before 1.0: API_DECISIONS.md
      - Changelog: changelog.md
      - Architecture: ARCHITECTURE.md
      - odfpy compatibility details: ODFPY_COMPAT.md
      - XSD cross-check: XSD_DIFF.md
      - XSD cross-check, full list: reports/xsd-diff.md
      - Roadmap: ROADMAP.md
      - Attributions: ATTRIBUTIONS.md
